name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example v0.5.0 or v0.5.0-beta'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  boot-image:
    name: Build Linux boot image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build boot image
        run: bash ./src/InstallerLinux/build/build-installer-image.sh ./artifacts/installer-linux

      - name: Package standalone ISO release zip
        run: |
          cd artifacts/installer-linux
          zip -9 ../HAOS-Installer-ISO.zip \
            haos-installer-x86_64.iso \
            haos-installer-x86_64.iso.sha256 \
            haos-installer-x86_64.iso.manifest.json

      - name: Upload boot image
        uses: actions/upload-artifact@v7
        with:
          name: haos-usb-creator-boot-image
          path: |
            artifacts/installer-linux/haos-installer-x86_64.img
            artifacts/installer-linux/haos-installer-x86_64.img.sha256
            artifacts/installer-linux/haos-installer-x86_64.img.manifest.json
          if-no-files-found: error

      - name: Upload standalone ISO release zip
        uses: actions/upload-artifact@v7
        with:
          name: haos-installer-iso-zip
          path: artifacts/HAOS-Installer-ISO.zip
          if-no-files-found: error

  windows-app:
    name: Publish Windows app
    runs-on: windows-latest
    needs: boot-image

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Download boot image
        uses: actions/download-artifact@v8
        with:
          name: haos-usb-creator-boot-image
          path: src/WindowsApp/src/HAOSInstaller.App/Assets/BootImage

      - name: Download standalone ISO release zip
        uses: actions/download-artifact@v8
        with:
          name: haos-installer-iso-zip
          path: publish

      - name: Validate bundled boot image
        run: powershell -ExecutionPolicy Bypass -File .\src\WindowsApp\validate-bundled-boot-image.ps1

      - name: Test
        run: dotnet test .\src\WindowsApp\HAOSInstaller.slnx -c Release -p:Platform=x64

      - name: Publish
        run: dotnet publish .\src\WindowsApp\src\HAOSInstaller.App\HAOSInstaller.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o .\publish\win-x64

      - name: Package Windows app
        run: |
          if (Test-Path .\publish\HAOS-USB-Creator-win-x64.zip) {
            Remove-Item .\publish\HAOS-USB-Creator-win-x64.zip -Force
          }
          7z a -tzip .\publish\HAOS-USB-Creator-win-x64.zip .\publish\win-x64\*

      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: haos-usb-creator-win-x64
          path: publish/HAOS-USB-Creator-win-x64.zip
          if-no-files-found: error

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') {
            throw "Tag must look like v0.5.0 or v0.5.0-beta. Got: $tag"
          }

          git fetch origin "refs/tags/$tag:refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag already exists: $tag"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag"

      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            publish/HAOS-USB-Creator-win-x64.zip
            publish/HAOS-Installer-ISO.zip

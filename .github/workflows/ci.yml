name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux-app:
    name: Linux app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        run: python3 -m unittest discover -s src/LinuxApp/tests -v

      - name: Check GTK import
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0
          cd src/LinuxApp
          /usr/bin/python3 -c 'import gui'

  windows-app:
    name: Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\src\WindowsApp\HAOSInstaller.slnx

      - name: Build
        run: dotnet build .\src\WindowsApp\HAOSInstaller.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test .\src\WindowsApp\HAOSInstaller.slnx -c Release -p:Platform=x64 --no-build

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-app:
    name: Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\src\WindowsApp\HAOSInstaller.slnx

      - name: Build
        run: dotnet build .\src\WindowsApp\HAOSInstaller.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test .\src\WindowsApp\HAOSInstaller.slnx -c Release -p:Platform=x64 --no-build
